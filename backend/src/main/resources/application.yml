server:
  port: ${PORT:8080}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/erp_portal}
      database: ${MONGODB_NAME:erp_portal}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC
  mail:
    host: ${EMAIL_HOST:localhost}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_HOST_USER:}
    password: ${EMAIL_HOST_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${EMAIL_USE_TLS:true}
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB


app:
  jwt:
    secret: ${JWT_SECRET:} # REQUIRED — no fallback. App will refuse to start if blank.
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  director:
    email: ${DIRECTOR_EMAIL:admin@ciet.edu.in}
    password: ${DIRECTOR_PASSWORD:}
  mail:
    from: ${DEFAULT_FROM_EMAIL:support@ciet.edu.in}
